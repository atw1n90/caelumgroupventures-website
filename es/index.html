  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4.5vw,60px);line-height:1;color:#EDF0F7;\">Plan de vuelo, <em style=\"color:#D9A94E;\">tres movimientos.<\u002Fem><\u002Fh2>\n          <p style=\"max-width:54ch;font-size:16px;line-height:1.6;color:#8B93A7;margin:12px 0 30px;text-wrap:pretty;\">La tecnología debe mover un negocio hacia adelante, no hacia los lados. Cada venture que operamos sigue la misma secuencia.<\u002Fp>\n          <div style=\"display:grid;align-content:start;\">\n            <div style=\"display:grid;grid-template-columns:{{ apprCols }};gap:10px 24px;padding:24px 0;border-top:1px solid rgba(235,240,255,0.1);\">\n              <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:#D9A94E;padding-top:8px;\">T−03 / EVALUAR<\u002Fdiv>\n              <div>\n                <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;color:#EDF0F7;\">Encontrar la fricción.<\u002Fdiv>\n                <p style=\"margin:8px 0 0;max-width:58ch;font-size:15px;line-height:1.6;color:#8B93A7;text-wrap:pretty;\">Dónde un negocio pierde tiempo, respuestas o impulso. Miramos antes de construir. Algunos problemas necesitan software. Otros solo necesitan un proceso más claro.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:{{ apprCols }};gap:10px 24px;padding:24px 0;border-top:1px solid rgba(235,240,255,0.1);\">\n              <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:#D9A94E;padding-top:8px;\">T−02 / CONSTRUIR<\u002Fdiv>\n              <div>\n                <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;color:#EDF0F7;\">Lanzar lo más pequeño que funcione.<\u002Fdiv>\n                <p style=\"margin:8px 0 0;max-width:58ch;font-size:15px;line-height:1.6;color:#8B93A7;text-wrap:pretty;\">Productos enfocados, no plataformas. Cada proyecto d=\"1\" style=\"animation:fieldIn 0.26s cubic-bezier(0.16,1,0.3,1) 0.145s both;\">\n                  <label for=\"c2-email\" style=\"display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.2em;color:#8B93A7;margin-bottom:5px;\">CORREO<\u002Flabel>\n                  <input id=\"c2-email\" name=\"email\" required=\"\" type=\"email\" style=\"width:100%;box-sizing:border-box;background:transparent;border:none;border-bottom:1px solid rgba(235,240,255,0.2);font-family:'Instrument Sans',Helvetica,sans-serif;font-size:15px;color:#EDF0F7;padding:8px 0;outline:none;border-radius:0;transition:border-color 0.2s;\" style-focus=\"border-bottom-color:#D9A94E;\">\n                <\u002Fdiv>\n                <div data-field=\"1\" style=\"animation:fieldIn 0.26s cubic-bezier(0.16,1,0.3,1) 0.2s both;\">\n                  <label for=\"c2-topic\" style=\"display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.2em;color:#8B93A7;margin-bottom:5px;\">SOBRE<\u002Flabel>\n                  <sc-raw-select id=\"c2-topic\" name=\"topic\" style=\"width:100%;box-sizing:border-box;background:#0B0E17;border:none;border-bottom:1px solid rgba(235,240,255,0.2);font-family:'Instrument Sans',Helvetica,sans-serif;font-size:15px;color:#EDF0F7;padding:8px 0;outline:none;border-radius:0;\">\n                    <option>nocrickets<\u002Foption>\n                    <option>suvelo<\u002Foption>\n                    <option>una nueva idea<\u002Foption>\n                    <option>otra cosa<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div data-field=\"1\" style=\"animation:fieldIn 0.26s cubic-bezier(0.16,1,0.3,1) 0.255s both;\">\n                  <label for=\"c2-msg\" style=\"display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.2em;color:#8B93A7;margin-bottom:5px;\">MENSAJE<\u002Flabel>\n                  <textarea id=\"c2-msg\" name=\"message\" required=\"\" rows=\"3\" style=\"width:100%;box-sizing:border-box;background:transparent;border:none;border-bottom:1px solid rgba(235,240,255,0.2);font-family:'Instrument Sans',Helvetica,sans-serif;font-size:15px;color:#EDF0F7;padding:8px 0;outline:none;resize:vertical;border-radius:0;transition:border-color 0.2s;\" style-focus=\"border-bottom-color:#D9A94E;\"><\u002Ftextarea>\n                <\u002Fdiv>\n                <div data-field=\"1\" style=\"animation:fieldIn 0.26s cubic-bezier(0.16,1,0.3,1) 0.31s both;\">\n                  <button type=\"submit\" style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;border:1px solid #D9A94E;background:rgba(217,169,78,0.12);color:#D9A94E;cursor:pointer;padding:12px 22px;transition:background 0.2s,color 0.2s;\" style-hover=\"background:#D9A94E;color:#07090F;\">ENVIAR →<\u002Fbutton>\n                <\u002Fdiv>\n                              <p data-field=\"1\" style=\"margin:-4px 0 0;font-family:'Instrument Sans',Helvetica,sans-serif;font-size:12px;line-height:1.55;color:#8B93A7;animation:fieldIn 0.26s cubic-bezier(0.16,1,0.3,1) 0.36s both;\"><strong style=\"color:#EDF0F7;font-weight:600;\">Privacidad:<\u002Fstrong> Usamos tu nombre, correo, tema y mensaje solo para responder a tu consulta. No vendemos esta información. Puedes escribir a admin@caelumgroupventures.com para pedir que eliminemos una consulta anterior.<\u002Fp>\n<\u002Fform>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n\n    <footer style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:11px 20px;border-top:1px solid rgba(235,240,255,0.1);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.18em;color:#545C70;\">\n      <span>© 2026 CAELUM GROUP VENTURES LLC<\u002Fspan>\n      <a href=\"mailto:admin@caelumgroupventures.com\" style=\"color:#8B93A7;text-decoration:none;transition:color 0.2s;\" style-hover=\"color:#D9A94E;\">ADMIN@CAELUMGROUPVENTURES.COM<\u002Fa>\n      <span style=\"margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 18px;\">\n        <a href=\"https://nocrickets.co\" target=\"_blank\" rel=\"noopener\" style=\"color:#8B93A7;text-decoration:none;transition:color 0.2s;\" style-hover=\"color:#D9A94E;\">NOCRICKETS.CO ↗<\u002Fa>\n        <a href=\"https://suvelo.app\" target=\"_blank\" rel=\"noopener\" style=\"color:#8B93A7;text-decoration:none;transition:color 0.2s;\" style-hover=\"color:#D9A94E;\">SUVELO.APP ↗<\u002Fa>\n      <\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;density&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.3, &quot;max&quot;: 2.5, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Star chart&quot;}, &quot;parallax&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Star chart&quot;}, &quot;showStatus&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { route: (location.hash || '').replace('#', '') || 'home', contactOpen: false, sent: false, utc: '', isMobile: matchMedia('(max-width: 720px)').matches };\n  skyRef = React.createRef();\n  heroRef = React.createRef();\n\n  componentDidMount() {\n    this._onHash = () => {\n      const r = (location.hash || '').replace('#', '') || 'home';\n      if (['home', 'ventures', 'approach'].includes(r) && r !== this.state.route) {\n        this.setState({ route: r }, () => { if (r === 'home') this.startSky(); });\n      }\n    };\n    window.addEventListener('hashchange', this._onHash);\n    this._onKey = (e) => { if (e.key === 'Escape' && this.state.contactOpen) this.setState({ contactOpen: false }); };\n    window.addEventListener('keydown', this._onKey);\n    this._mouse = { x: -1e4, y: -1e4 };\n    this._onMove = (e) => {\n      const c = this.skyRef.current;\n      if (!c) return;\n      const r = c.getBoundingClientRect();\n      this._mouse = { x: e.clientX - r.left, y: e.clientY - r.top, inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom };\n    };\n    window.addEventListener('mousemove', this._onMove);\n    const clock = () => {\n      const d = new Date();\n      const p = (n) => String(n).padStart(2, '0');\n      this.setState({ utc: p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) });\n    };\n    clock();\n    this._clock = setInterval(clock, 1000);\n    this._mq = matchMedia('(max-width: 720px)');\n    this._onMq = () => this.setState({ isMobile: this._mq.matches });\n    this._mq.addEventListener('change', this._onMq);\n    this.startSky();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this._onHash);\n    window.removeEventListener('keydown', this._onKey);\n    window.removeEventListener('mousemove', this._onMove);\n    clearInterval(this._clock);\n    if (this._mq) this._mq.removeEventListener('change', this._onMq);\n    cancelAnimationFrame(this._raf);\n  }\n\n  startSky() {\n    cancelAnimationFrame(this._raf);\n    const c = this.skyRef.current;\n    if (!c) return;\n    const ctx = c.getContext('2d');\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    let w = 0, h = 0, stars = [];\n    // Caelum's principal stars, normalized chart coords (alpha, beta, gamma, delta Caeli)\n    const CAE = [\n      { nx: 0.58, ny: 0.78, name: 'δ CAE' },\n      { nx: 0.66, ny: 0.58, name: 'α CAE' },\n      { nx: 0.71, ny: 0.34, name: 'β CAE' },\n      { nx: 0.85, ny: 0.20, name: 'γ CAE' }\n    ];\n    const build = () => {\n      const r = c.getBoundingClientRect();\n      if (!r.width) return;\n      w = r.width; h = r.height;\n      c.width = w * dpr; c.height = h * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      const density = this.props.density ?? 1;\n      stars = Array.from({ length: Math.round(w * h / 3800 * density) }, () => ({\n        x: Math.random() * w, y: Math.random() * h,\n        z: 0.25 + Math.random() * 0.75,\n        r: 0.4 + Math.random() * 1.1,\n        ph: Math.random() * Math.PI * 2,\n        sp: 0.4 + Math.random() * 1.4\n      }));\n    };\n    build();\n    window.removeEventListener('resize', this._skyResize || (() => {}));\n    this._skyResize = build;\n    window.addEventListener('resize', build);\n    const t0 = performance.now();\n    const parallaxOn = () => this.props.parallax ?? true;\n    const tick = (t) => {\n      if (!this.skyRef.current) return;\n      const elapsed = (t - t0) / 1000;\n      const m = this._mouse;\n      const px = parallaxOn() && m.inside ? (m.x - w / 2) : 0;\n      const py = parallaxOn() && m.inside ? (m.y - h / 2) : 0;\n      ctx.clearRect(0, 0, w, h);\n      // chart grid\n      ctx.strokeStyle = 'rgba(235,240,255,0.045)';\n      ctx.lineWidth = 1;\n      for (let gx = 0; gx <= 6; gx++) { const x = w * gx / 6; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }\n      for (let gy = 0; gy <= 4; gy++) { const y = h * gy / 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }\n      // starfield with twinkle + parallax\n      for (const s of stars) {\n        const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.ph + elapsed * s.sp));\n        const ox = -px * 0.012 * s.z, oy = -py * 0.012 * s.z;\n        ctx.fillStyle = 'rgba(237,240,247,' + (tw * 0.75 * s.z).toFixed(3) + ')';\n        ctx.beginPath(); ctx.arc(s.x + ox, s.y + oy, s.r, 0, Math.PI * 2); ctx.fill();\n      }\n      // constellation draw-in\n      const pts = CAE.map(p => ({ x: p.nx * w - px * 0.02, y: p.ny * h - py * 0.02, name: p.name }));\n      const prog = Math.min(1, Math.max(0, (elapsed - 0.6) / 2.2));\n      const segs = pts.length - 1;\n      ctx.strokeStyle = 'rgba(217,169,78,0.55)';\n      ctx.lineWidth = 1;\n      for (let i = 0; i < segs; i++) {\n        const segProg = Math.min(1, Math.max(0, prog * segs - i));\n        if (segProg <= 0) break;\n        const a = pts[i], b = pts[i + 1];\n        ctx.beginPath();\n        ctx.moveTo(a.x, a.y);\n        ctx.lineTo(a.x + (b.x - a.x) * segProg, a.y + (b.y - a.y) * segProg);\n        ctx.stroke();\n      }\n      ctx.font = '9px \"Space Mono\", monospace';\n      for (let i = 0; i < pts.length; i++) {\n        const p = pts[i];\n        const on = prog * segs >= i - 0.15;\n        const glow = on ? 1 : 0.25;\n        ctx.fillStyle = 'rgba(217,169,78,' + (0.9 * glow).toFixed(2) + ')';\n        ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); ctx.fill();\n        ctx.strokeStyle = 'rgba(217,169,78,' + (0.4 * glow).toFixed(2) + ')';\n        ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2); ctx.stroke();\n        if (on) {\n          ctx.fillStyle = 'rgba(139,147,167,0.85)';\n          ctx.fillText(p.name, p.x + 12, p.y + 3);\n        }\n      }\n      // crosshair + RA/DEC readout\n      if (m.inside) {\n        ctx.strokeStyle = 'rgba(217,169,78,0.16)';\n        ctx.setLineDash([3, 5]);\n        ctx.beginPath(); ctx.moveTo(m.x, 0); ctx.lineTo(m.x, h); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(0, m.y); ctx.lineTo(w, m.y); ctx.stroke();\n        ctx.setLineDash([]);\n        const raMin = 270 + (m.x / w) * 35; // 4h30m..5h05m in minutes\n        const ra = '0' + Math.floor(raMin / 60) + 'H ' + String(Math.floor(raMin % 60)).padStart(2, '0') + 'M';\n        const dec = (-46 + (1 - m.y / h) * 11).toFixed(1);\n        ctx.fillStyle = 'rgba(217,169,78,0.75)';\n        ctx.font = '9px \"Space Mono\", monospace';\n        const tx = m.x + 14 > w - 130 ? m.x - 128 : m.x + 14;\n        const ty = m.y - 10 < 14 ? m.y + 20 : m.y - 10;\n        ctx.fillText('RA ' + ra + ' / DEC ' + dec + '°', tx, ty);\n      }\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  go(route) {\n    this.setState({ route, contactOpen: false, sent: false }, () => {\n      location.hash = route === 'home' ? '' : route;\n      if (route === 'home') this.startSky();\n    });\n  }\n\n  scr(el) {\n    if (!el) return;\n    if (!el.dataset.o) el.dataset.o = el.textContent;\n    const orig = el.dataset.o;\n    clearInterval(el._t);\n    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ·/−';\n    let i = 0, steps = 9;\n    el._t = setInterval(() => {\n      i++;\n      el.textContent = orig.split('').map((ch, j) =>\n        ch === ' ' ? ' ' : (j < (i / steps) * orig.length ? ch : chars[Math.random() * chars.length | 0])\n      ).join('');\n      if (i >= steps) { clearInterval(el._t); el.textContent = orig; }\n    }, 32);\n  }\n\n  renderVals() {\n    const { route, contactOpen, sent, utc } = this.state;\n    const line = (r) => route === r ? '#D9A94E' : 'transparent';\n    const fg = (r) => route === r ? '#EDF0F7' : '#8B93A7';\n    return {\n      isHome: route === 'home', isVentures: route === 'ventures', isApproach: route === 'approach',\n      homeLine: line('home'), homeFg: fg('home'),\n      ventLine: line('ventures'), ventFg: fg('ventures'),\n      apprLine: line('approach'), apprFg: fg('approach'),\n      contactOpen, sent, notSent: !sent, utc,\n      apprCols: this.state.isMobile ? '1fr' : '140px 1fr',\n      showStatus: this.props.showStatus ?? true,\n      skyRef: this.skyRef, heroRef: this.heroRef,\n      goHome: () => this.go('home'),\n      goVentures: () => this.go('ventures'),\n      goApproach: () => this.go('approach'),\n      openContact: () => this.setState({ contactOpen: true, sent: false }),\n      closeContact: () => this.setState({ contactOpen: false }),\n      stopProp: (e) => e.stopPropagation(),\n      submit: (e) => {\n        e.preventDefault();\n        const f = e.currentTarget;\n        const v = (n) => (f.elements[n] && f.elements[n].value) || '';\n        const subject = 'Caelum inquiry — ' + v('topic');\n        const body = 'Name: ' + v('name') + '\\nEmail: ' + v('email') + '\\nRegarding: ' + v('topic') + '\\n\\n' + v('message');\n        window.location.href = 'mailto:admin@caelumgroupventures.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);\n        this.setState({ sent: true });\n      },\n      scrEnter: (e) => this.scr(e.currentTarget.querySelector('[data-scr]'))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
